
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090e1b">
  <title>DHUDDA HUB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">D</div>
        <div>
          <strong>DHUDDA HUB</strong>
          <small>Stay close. Talk freely.</small>
        </div>
      </div>
      <span class="online-label"><i></i> Connected</span>
    </header>

    <main>
      <section id="login" class="login-screen">
        <div class="login-card">
          <div class="brand-icon big">D</div>
          <h1>Welcome to <span>DHUDDA</span></h1>
          <p>Connect with your people, anywhere.</p>

          <label>Your name</label>
          <input id="username" placeholder="Enter your name" maxlength="30">

          <label>Room name</label>
          <input id="roomName" placeholder="Example: friends-room" maxlength="50">

          <div class="call-options">
            <button onclick="startCall('audio')" class="option">
              <span>🎙️</span>
              <b>Audio Call</b>
              <small>Voice only</small>
            </button>
            <button onclick="startCall('video')" class="option">
              <span>📹</span>
              <b>Video Call</b>
              <small>Face to face</small>
            </button>
            <button onclick="startCall('group')" class="option">
              <span>👥</span>
              <b>Group Call</b>
              <small>Up to 8 people*</small>
            </button>
          </div>
          <p class="hint">Everyone must join using the same room name.</p>
          <p id="loginError" class="error"></p>
        </div>
      </section>

      <section id="callScreen" class="call-screen hidden">
        <div class="call-heading">
          <div>
            <h2 id="activeRoom">Call Room</h2>
            <p id="callStatus">Connecting...</p>
          </div>
          <div class="participant-count">
            <span>👥</span>
            <b id="participantCount">1</b>
          </div>
        </div>

        <div id="videoGrid" class="video-grid">
          <div id="localTile" class="video-tile local-tile">
            <video id="localVideo" autoplay muted playsinline></video>
            <span class="tile-name">You</span>
            <span class="local-badge">YOU</span>
          </div>
        </div>

        <div class="call-controls">
          <button id="micButton" class="control" onclick="toggleMute()">
            <span>🎙️</span><small>Mute</small>
          </button>
          <button id="cameraButton" class="control" onclick="toggleCamera()">
            <span>📷</span><small>Camera</small>
          </button>
          <button class="control" onclick="switchCamera()">
            <span>🔄</span><small>Flip</small>
          </button>
          <button class="control" onclick="enableSpeaker()">
            <span>🔊</span><small>Speaker</small>
          </button>
          <button class="control end-call" onclick="endCall()">
            <span>📞</span><small>End</small>
          </button>
        </div>
        <p class="footer-note">*Group size depends on your LiveKit plan and room settings.</p>
      </section>
    </main>

    <footer>© DHUDDA HUB · Made to stay connected</footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
